[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttide-academy"
version = "0.2.0"
description = "量潮实训基地工具箱：群聊意图转待办（intent）、重点人员跟踪（watch）与组织群聊管理（org）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6,<7",
  "tzdata>=2023.3,<2027",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
feishu-workflows = "quanttide_academy.cli:entry"
feishu-workflows-setup = "quanttide_academy.setup:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quanttide_academy = ["core/*.sql", "core/*.yaml", "intent/prompts/*.md", "intent/schemas/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.db", "config.yaml", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/quanttide_academy"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731", "E741", "F403", "F405"]
"scripts/**" = ["E402"]
